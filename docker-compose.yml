services:
  shidan-meal-planner:
    build: .
    image: shidan-meal-planner:latest
    container_name: shidan-meal-planner
    ports:
      - "8765:8765"
    restart: unless-stopped
    # 家庭共享数据持久化（data/state.json）
    volumes:
      - ./data:/app/data
    # 通过 Authentik 代理域名访问（非 IP / 主机名）时，在此放行，逗号分隔多个：
    environment:
      - SHIDAN_HOSTS=eat.ihxq.fun
