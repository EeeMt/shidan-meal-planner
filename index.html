<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f97316">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="输入食材自动安排一周食谱；想吃哪道菜自动生成采购清单。">
  <title>食单 · 一周食谱规划</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23f97316'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle'%3E%F0%9F%8D%B3%3C/text%3E%3C/svg%3E">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">🍳 <b>食单</b><span>一周食谱规划</span></div>
    <div id="headerActions" class="header-actions"></div>
  </header>

  <main id="main">
    <section id="tab-plan" class="tab-panel active"></section>
    <section id="tab-recipes" class="tab-panel"></section>
    <section id="tab-inventory" class="tab-panel"></section>
    <section id="tab-shopping" class="tab-panel"></section>
    <section id="tab-settings" class="tab-panel"></section>
  </main>

  <nav class="bottom-nav">
    <button class="nav-item active" data-tab="plan"><span class="nav-ico">🗓️</span><span>一周计划</span></button>
    <button class="nav-item" data-tab="recipes"><span class="nav-ico">📖</span><span>菜谱</span></button>
    <button class="nav-item" data-tab="inventory"><span class="nav-ico">🧺</span><span>库存</span></button>
    <button class="nav-item" data-tab="shopping"><span class="nav-ico">🛒</span><span>购物</span></button>
    <button class="nav-item" data-tab="settings"><span class="nav-ico">⚙️</span><span>设置</span></button>
  </nav>

  <div id="toast" class="toast" hidden></div>
  <div id="modal-root"></div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>

  <script src="recipes.js"></script>
  <script src="core.js"></script>
  <script src="parser.js"></script>
  <script src="storage.js"></script>
  <script src="app.js"></script>
</body>
</html>
